groups:
  - name: careerfit_alerts
    rules:
      - alert: BackendDown
        expr: up{job="careerfit-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"

      - alert: HighErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m]) > 0)) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency is above 2 seconds"

      - alert: HighHikariPoolUsage
        expr: (sum by (pool) (hikaricp_connections_active) / sum by (pool) (hikaricp_connections_max) > 0) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP active connections above 80%"
