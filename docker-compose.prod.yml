networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?required}
      POSTGRES_USER: ${DB_USER:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    networks:
      - internal
    volumes:
      - careerfit_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  backend:
    build:
      context: ./Backend/careerfit-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?required}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      APP_BASE_URL: ${APP_BASE_URL:?required}
      CORS_ORIGINS: ${CORS_ORIGINS:?required}
      MAGIC_LINK_EXPOSE_TOKEN: "false"
      DEMO_MODE: ${DEMO_MODE:-false}
      LOCAL_SMOKE_TEST: ${LOCAL_SMOKE_TEST:-false}
      STORAGE_PATH: /app/storage/cv
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      OCR_ENABLED: "true"
      TESSERACT_COMMAND: "tesseract"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - careerfit_prod_storage:/app/storage
      - careerfit_prod_logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml
      - careerfit_prod_prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    networks:
      - internal
      - edge
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?required}
    volumes:
      - careerfit_prod_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
    profiles:
      - monitoring

volumes:
  careerfit_prod_pgdata:
  careerfit_prod_storage:
  careerfit_prod_logs:
  careerfit_prod_prom_data:
  careerfit_prod_grafana_data:
