name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Run Backend Tests
      run: |
        cd Backend/careerfit-backend
        ./mvnw test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'Frontend/package-lock.json'
    - name: Build Frontend
      run: |
        cd Frontend
        npm ci
        npm run build
        npm run check-bundle

  docker-build-verify:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'Frontend/package-lock.json'
    - name: Install Frontend Dependencies and Playwright
      run: |
        cd Frontend
        npm ci
        npx playwright install --with-deps chromium
    - name: Generate Dummy Env for Compose
      run: |
        echo "DB_NAME=dummy_db" > .env.prod.ci
        echo "DB_USER=dummy_user" >> .env.prod.ci
        echo "DB_PASSWORD=dummy_pass" >> .env.prod.ci
        echo "JWT_SECRET=dummy_secret_at_least_32_characters" >> .env.prod.ci
        echo "GRAFANA_PASSWORD=dummy_grafana_pass" >> .env.prod.ci
        echo "APP_BASE_URL=https://dummy.com" >> .env.prod.ci
        echo "CORS_ORIGINS=https://dummy.com" >> .env.prod.ci
        echo "DEMO_MODE=true" >> .env.prod.ci
        echo "FRONTEND_PORT=18080" >> .env.prod.ci
    - name: Verify Compose Config
      run: docker compose --env-file .env.prod.ci -p thesis-ci -f docker-compose.prod.yml config
    - name: Start Compose Stack
      run: docker compose --env-file .env.prod.ci -p thesis-ci -f docker-compose.prod.yml up -d --build
    - name: Wait for Stack to be Healthy
      run: |
        echo "Waiting for stack to be healthy..."
        TIMEOUT=90
        ELAPSED=0
        until docker compose -p thesis-ci exec backend curl -s http://localhost:8080/actuator/health/readiness | grep -q "UP" && curl -s http://localhost:18080 > /dev/null; do
          if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
            echo "Timeout waiting for stack to be healthy."
            docker compose -p thesis-ci ps
            docker compose -p thesis-ci logs backend frontend
            exit 1
          fi
          sleep 5
          ELAPSED=$((ELAPSED+5))
        done
        echo "Stack is healthy!"
    - name: Run E2E Tests
      env:
        BASE_URL: http://localhost:18080
      run: |
        cd Frontend
        npx playwright test --config=playwright.prod.config.ts
    - name: Cleanup Stack
      if: always()
      run: docker compose --env-file .env.prod.ci -p thesis-ci -f docker-compose.prod.yml down -v
