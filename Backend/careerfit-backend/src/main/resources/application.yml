spring:
  application:
    name: careerfit-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:careerfit}}
    username: ${SPRING_DATASOURCE_USERNAME:careerfit}
    password: ${SPRING_DATASOURCE_PASSWORD:careerfit}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@careerfit.dev}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  async:
    executor:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 100
      thread-name-prefix: careerfit-async-

  mvc:
    pathmatch:
      use-suffix-pattern: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# Application-specific config
app:
  jwt:
    secret: ${JWT_SECRET:careerfit-dev-secret-key-must-be-at-least-32-chars-long}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

  magic-link:
    expiration-minutes: 15
    base-url: ${APP_BASE_URL:http://localhost:8080}
    expose-token-in-response: ${MAGIC_LINK_EXPOSE_TOKEN:true}

  email-action:
    base-url: ${EMAIL_ACTION_BASE_URL:}

  storage:
    local-path: ${STORAGE_PATH:./storage/cv}
    max-file-size-mb: 10

  ocr:
    enabled: ${OCR_ENABLED:true}
    tesseract-command: ${TESSERACT_COMMAND:tesseract}
    languages: ${OCR_LANGUAGES:vie+eng}
    dpi: ${OCR_DPI:220}
    max-pages: ${OCR_MAX_PAGES:8}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:45}

  mail:
    enabled: ${APP_MAIL_ENABLED:false}

  matching:
    high-match-threshold-candidate: 90.0
    high-match-threshold-recruiter: 85.0
    score-label-low-max: 40.0
    score-label-medium-max: 70.0
    score-label-high-max: 90.0

  scheduler:
    zone: "Asia/Ho_Chi_Minh"
    recompute-delay-ms: 1800000
    notification-delay-ms: 14400000
    auto-apply-delay-ms: 7200000
    daily-digest-cron: "0 0 8 * * *"     # 08:00 daily
    token-cleanup-cron: "0 0 3 * * *"    # 03:00 daily

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.careerfit: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

management:
  health:
    mail:
      enabled: ${APP_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
