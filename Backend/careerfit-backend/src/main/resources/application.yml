spring:
  application:
    name: careerfit-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/careerfit
    username: careerfit
    password: careerfit
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@careerfit.dev}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  async:
    executor:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 100
      thread-name-prefix: careerfit-async-

  mvc:
    pathmatch:
      use-suffix-pattern: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# Application-specific config
app:
  jwt:
    secret: ${JWT_SECRET:careerfit-dev-secret-key-must-be-at-least-32-chars-long}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

  magic-link:
    expiration-minutes: 15
    base-url: ${APP_BASE_URL:http://localhost:8080}

  storage:
    local-path: ${STORAGE_PATH:./storage/cv}
    max-file-size-mb: 10

  matching:
    high-match-threshold-candidate: 90.0
    high-match-threshold-recruiter: 85.0
    score-label-low-max: 40.0
    score-label-medium-max: 70.0
    score-label-high-max: 90.0

  scheduler:
    job-scan-cron: "0 0 * * * *"         # every hour
    daily-digest-cron: "0 0 8 * * *"     # 08:00 daily
    token-cleanup-cron: "0 0 2 * * *"    # 02:00 daily
    market-snapshot-cron: "0 30 1 * * *" # 01:30 daily

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.careerfit: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
