services:
  postgres:
    image: postgres:16
    container_name: careerfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careerfit
      POSTGRES_USER: careerfit
      POSTGRES_PASSWORD: careerfit
    ports:
      - "5432:5432"
    volumes:
      - careerfit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerfit -d careerfit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  careerfit_postgres_data:
