services:
  postgres:
    image: postgres:16-alpine
    container_name: careerfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-careerfit}
      POSTGRES_USER: ${DB_USER:-careerfit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-careerfit}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - careerfit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles:
      - backend
    build:
      context: ./Backend/careerfit-backend
      dockerfile: Dockerfile
    container_name: careerfit-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-careerfit}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-careerfit}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-careerfit}
      JWT_SECRET: ${JWT_SECRET:-careerfit-dev-secret-key-must-be-at-least-32-chars-long}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      MAGIC_LINK_EXPOSE_TOKEN: ${MAGIC_LINK_EXPOSE_TOKEN:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      STORAGE_PATH: /app/storage/cv
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      TESSERACT_COMMAND: ${TESSERACT_COMMAND:-tesseract}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-vie+eng}
      OCR_DPI: ${OCR_DPI:-220}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-8}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-45}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - careerfit_backend_storage:/app/storage

volumes:
  careerfit_postgres_data:
  careerfit_backend_storage:
